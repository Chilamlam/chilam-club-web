name: Daily Update

# ============================================================================
# 这个文件已「薄壳化」：除了装环境、跑一条命令、提交 data/ 之外不做任何事。
#
# 为什么：本仓库的 PAT 只有 repo scope，没有 workflow scope，因此
#         .github/workflows/*.yml 无法通过 git push、Contents API 或
#         Git Data API 修改（四条路全部实测被拒），只能人工在网页端粘贴。
#         而跑批步骤、顺序、依赖、secrets、自检项是最常变动的部分——
#         每次变动都要人工介入是不可接受的。
#
# 于是把所有会变的东西下沉到普通 Python 文件（可自由推送）：
#         步骤清单 / 顺序 / 超时 / 回溯策略 / 失败语义 → run_daily.py
#         依赖清单                                    → requirements-batch.txt
#         数据新鲜度自检                              → run_daily.py 内 FRESHNESS
#         secrets                                     → 由下方 toJSON(secrets) 整体透传
#
# 关键点：secrets 用 `toJSON(secrets)` 一次性整体注入，所以**新增任何 secret
#         都不必再改本文件**（例如加 DIGEST_SERVERCHAN_KEY，只在仓库 Secrets
#         页面添加即可，代码侧自动可见）。
#
# 结论：本文件此后应无需再改。若确实要改，说明有新的「不可下沉」的需求，
#       请先确认是否真的必须写在 yml 里。
# ============================================================================

on:
  schedule:
    - cron: '37 11 * * *' # 北京时间 19:37 主跑批（错开整点/半点高峰，减少 Actions 排队延迟）
    - cron: '20 14 * * *' # 北京时间 22:20 兜底补跑（主跑批被延迟或失败时保证当日数据落地）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '历史回溯天数（0=仅当日增量。战绩可回溯任意天数；情绪归档受东财接口限制自动截顶为 15）'
        required: false
        default: '0'
      only:
        description: '只跑指定步骤，逗号分隔（留空=全跑）。可选：rps,etf,market_monitor,speculation,guru,radar,snapshot,breakout,sentiment,scorecard,digest'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-batch.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-batch.txt

    # 全部跑批由编排器统一执行。它内部逐步骤捕获异常与非零退出码后继续，
    # 并恒以 0 退出，等价于原先每步的 continue-on-error: true——
    # 任一脚本失败都不能导致当日全量数据不落盘。
    - name: Run daily pipeline
      env:
        ALL_SECRETS: ${{ toJSON(secrets) }}
        BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        # 手动输入一律走 env 而非直接插值进 run 脚本：${{ }} 会被原文拼进 shell，
        # 输入里带引号或分号就变成命令注入。走 env 后 shell 只当它是普通字符串。
        ONLY_STEPS: ${{ github.event.inputs.only }}
      run: |
        if [ -n "$ONLY_STEPS" ]; then
          python run_daily.py --only "$ONLY_STEPS"
        else
          python run_daily.py
        fi

    # ★★★ 防弹提交：本地提交后 rebase 远程，冲突以本地新数据为准，并重试推送 ★★★
    - name: Commit and push changes
      run: |
        git config --local user.name "GitHub Action"
        git config --local user.email "action@github.com"
        git add data/
        git commit -m "Auto-update daily data [skip ci]" || echo "No changes to commit"
        for i in 1 2 3; do
          git pull origin main --rebase && git push && exit 0
          echo "push attempt $i failed, retrying..."
          sleep 15
        done
        echo "::error::推送失败，data/ 未能写回仓库"
        exit 1
