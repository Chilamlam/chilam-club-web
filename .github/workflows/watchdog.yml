# 跑批看门狗（GitHub Actions 版）
# ================================
# 为什么存在：daily_update.yml 的 schedule 事件是 best-effort，高负载时整条派发
# 会被平台丢弃（2026-09-03 实测：19:37 主班未产生任何 run）。本工作流按「结果
# 导向」巡检——今天 data/ 里有没有今天的数据——缺失就 workflow_dispatch 补跑。
#
# 判据与退出码的完整设计见 tools_gh_watchdog.py 文档头，改判据前先读它。
#
# 两个班次共用本文件，靠「当时的 CST 时间」区分模式：
#   20:40 CST 主班巡检 —— 数据缺失可补跑（dispatch）
#   23:10 CST 兜底巡检 —— 只查不补（--check）：此时再派发，12~18 分钟后过零点，
#       跑批按「行情是否已发布」重锚定，很可能把昨天数据再写一遍。
#       兜底班的价值是「把 20:40 派发后的结果复核一遍」，仍缺失则红牌报警。
# 阈值 22:30 CST（14:30 UTC）：cron 延迟时两类班次都能落到正确的模式侧。
# 手动 workflow_dispatch = 主班模式（白天有时窗守卫保护，不会空派）。
#
# 权限说明：freshness 检查读的是公开仓库 raw，无需凭据；
# dispatch daily_update.yml 需要 actions:write —— GITHUB_TOKEN 即可
# （workflow_dispatch 是「GITHUB_TOKEN 触发的事件不产生新 run」规则的官方例外）。
name: watchdog

on:
  schedule:
    - cron: "40 12 * * 1-5" # 20:40 CST 主班巡检（周一至五）
    - cron: "10 15 * * 1-5" # 23:10 CST 兜底巡检，只查不补（周一至五）
  workflow_dispatch: # 手动触发，用于演练
    inputs:
      force:
        description: '强制演练「缺数据→dispatch」路径（跳过交易日与时间窗守卫，会真派发一次跑批）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 决定巡检模式（22:30 CST 之后只查不补）
        id: mode
        run: |
          # 10# 强制十进制：%H%M 的前导零（如 0805）在部分 shell 算术里会被当八进制
          NOW=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          if [ "$NOW" -ge 2230 ]; then
            echo "args=--check" >> "$GITHUB_OUTPUT"
            echo "mode=兜底巡检（只查不补）" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "mode=主班巡检（缺失可补跑）" >> "$GITHUB_OUTPUT"
          fi

      - name: 执行看门狗
        id: wd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ARGS="${{ steps.mode.outputs.args }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python3 tools_gh_watchdog.py $ARGS
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0   # 退出码先落盘，统一在下一步映射结论，避免把「无需跑批」误报成红牌

      - name: 退出码映射（0/1/4=绿，2/3/9=红）
        run: |
          RC=${{ steps.wd.outputs.rc }}
          case "$RC" in
            0) echo "✅ 今日数据已就位，什么都没做" ;;
            1) echo "⏭️ 今日无需跑批（非交易日或未到判定线），正常" ;;
            4) echo "::warning::数据缺失已派发补跑，结果尚未验证——若 23:10 兜底巡检仍报缺失，会红牌报警";;
            2) echo "::error::今日数据确实缺失且未能修复（兜底班）或补跑派发失败，需人工介入"; exit 1 ;;
            3) echo "::error::看门狗用法/凭据错误"; exit 1 ;;
            9) echo "::error::取数通道全部失效，本次什么都没验到——禁止据此补跑，需人工检查通道"; exit 1 ;;
            *) echo "::error::未知退出码 $RC"; exit 1 ;;
          esac
